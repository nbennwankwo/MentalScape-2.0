version: 2

models:
  - name: fct_mhsds_values
    description: Analysis ready MHSDS values from the preferred file of each month
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - release_month
              - period_start
              - period_end
              - breakdown
              - primary_code
              - secondary_code
              - measure_id
    columns:
      - name: measure_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_mhsds_measure')
                field: measure_id

  - name: dim_mhsds_measure
    description: One row per measure ID with its lifetime, reporting windows and caveats
    columns:
      - name: measure_id
        data_tests: [unique, not_null]

  - name: dim_mhsds_release
    description: One row per release month with the file used and how many values it gave
    columns:
      - name: release_month
        data_tests: [unique, not_null]
      - name: version_used
        data_tests:
          - accepted_values:
              arguments:
                values: ["final", "performance"]

  - name: geo_sub_icb_membership
    description: Dated membership of each Sub ICB in an ICB
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [sub_icb_code, valid_from_month]
    columns:
      - name: icb_code
        description: Null would mean the Sub ICB name did not match any ICB published that month
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: dim_sub_icb
    columns:
      - name: sub_icb_code
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["current", "retired"]

  - name: dim_icb
    columns:
      - name: icb_code
        data_tests: [unique, not_null]

  - name: dim_local_authority
    description: Every local authority code MHSDS has published, with its tier, lifetime and any April 2023 successor
    columns:
      - name: la_code
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["current", "abolished", "not in latest release"]

  - name: geo_local_authority_successor
    description: The successor of every local authority abolished in April 2023 and how its figures relate

  - name: fct_talking_therapies_values
    description: Analysis ready NHS Talking Therapies values, with the ICB of each Sub ICB from the dated membership
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [release_month, group_type, org_code1, org_code2, measure_id]
    columns:
      - name: measure_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_talking_therapies_measure')
                field: measure_id

  - name: dim_talking_therapies_measure
    description: One row per NHS Talking Therapies measure ID with its statistic and lifetime
    columns:
      - name: measure_id
        data_tests: [unique, not_null]

  - name: dim_talking_therapies_release
    description: One row per NHS Talking Therapies release month with the file used
    columns:
      - name: release_month
        data_tests: [unique, not_null]
      - name: version_used
        data_tests:
          - accepted_values:
              arguments:
                values: ["final", "performance"]

  - name: fct_population
    description: ONS population by single year of age and sex for every area and boundary edition since April 2023
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [boundary_edition, population_year, geo_level, geo_code, sex, age]
    columns:
      - name: population
        data_tests: [not_null]

  - name: fct_population_monthly
    description: Population denominators by area and broad age band for every release month
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [release_month, geo_level, geo_code, age_band]
    columns:
      - name: population
        data_tests: [not_null]

  - name: fct_deprivation_lsoa
    description: The Indices of Deprivation 2025 for every LSOA with its April 2026 Sub ICB, ICB and local authority
    columns:
      - name: lsoa_code
        data_tests: [unique, not_null]
      - name: sub_icb_code
        data_tests: [not_null]

  - name: fct_deprivation_area
    description: The Indices of Deprivation 2025 summarised for every Sub ICB, ICB and local authority
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [boundary_edition, geo_level, geo_code]
    columns:
      - name: imd_average_score
        data_tests: [not_null]
