# Machine readable register of data sources.
# The ingest code in Phase 1 reads this file. Human notes are in docs/04_data_sources.md.
# A url of null means the exact location is still to be confirmed in Phase 1.

sources:
  mhsds_monthly:
    title: Mental Health Services Monthly Statistics
    publisher: NHS England
    series_page: https://digital.nhs.uk/data-and-information/publications/statistical/mental-health-services-monthly-statistics
    release_page_pattern: "{series_page}/performance-{month_name}-{year}"
    cadence: monthly
    first_month_in_scope: "2022-07"
    # Kinds and versions are the labels produced by mentalscape.ingest.classify.
    kinds_wanted: [main, oaps, referral_spells, dq_coverage, dq_vodim]
    versions_wanted: [final, performance]
    version_rule: prefer End of Year Final when it exists, keep both in raw
    raw_store: GitHub Release data-mhsds-monthly (see docs/adr/0009)
    licence: Open Government Licence v3.0
    status: automated in Phase 1

  talking_therapies_monthly:
    title: NHS Talking Therapies for anxiety and depression, monthly statistics
    publisher: NHS England
    # Renamed from IAPT in May 2023. Releases before then are on the second page.
    series_page: https://digital.nhs.uk/data-and-information/publications/statistical/nhs-talking-therapies-monthly-statistics-including-employment-advisors
    earlier_series_page: https://digital.nhs.uk/data-and-information/publications/statistical/psychological-therapies-report-on-the-use-of-iapt-services
    cadence: monthly
    first_month_in_scope: "2022-07"
    # Kinds and versions are the labels produced by mentalscape.ingest.talking_therapies.
    kinds_wanted: [activity, dq]
    versions_wanted: [final, performance]
    version_rule: prefer Final over Performance, never use Provisional or Primary
    raw_store: GitHub Release data-talking-therapies-monthly (see docs/adr/0009)
    licence: Open Government Licence v3.0
    status: automated in Phase 1

  indices_of_deprivation_2025:
    title: English Indices of Deprivation 2025
    publisher: Ministry of Housing, Communities and Local Government
    release_page: https://www.gov.uk/government/statistics/english-indices-of-deprivation-2025
    geography: LSOA 2021, 33755 areas
    published: "2025-10-30"
    licence: Open Government Licence v3.0
    raw_store: GitHub Release data-reference (see reference_files below)
    status: automated in Phase 1
    caution: not a time series against IoD 2019, use as a snapshot

  ons_population_estimates:
    title: Lower layer Super Output Area mid year population estimates by single year of age and sex
    publisher: Office for National Statistics
    series_page: https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/populationestimates/datasets/lowersuperoutputareamidyearpopulationestimates
    licence: Open Government Licence v3.0
    raw_store: GitHub Release data-reference (see reference_files below)
    status: automated in Phase 1
    caution: ONS estimates on the April 2026 ICB boundaries were not yet published, so the warehouse builds them from LSOA estimates with the ONS best fit lookup

  ons_geography_lookups:
    title: LSOA to Sub ICB, ICB and local authority lookups, and the April 2023 local authority changes
    publisher: Office for National Statistics Open Geography Portal
    series_page: https://geoportal.statistics.gov.uk/
    licence: Open Government Licence v3.0, contains OS data, Crown copyright and database right
    raw_store: GitHub Release data-reference (see reference_files below)
    status: automated in Phase 1

  nhs_workforce:
    title: NHS Workforce Statistics, mental health staff groups
    publisher: NHS England
    series_page: null
    licence: Open Government Licence v3.0
    status: legacy copies exist, to automate in Phase 3 with the simulation that needs it

  mhsds_patient_level:
    title: Mental Health Services Data Set, pseudonymised record level
    publisher: NHS England via the Data Access Request Service
    licence: data sharing agreement required
    status: enquiry sent October 2026, not available

# Files at fixed addresses, collected by mentalscape.ingest.reference into the
# data-reference release. A new edition gets a new entry with a new id, so old
# builds stay repeatable. header_contains guards against an error page being
# saved in place of the data.
reference_files:
  iod_2025_file7:
    source: indices_of_deprivation_2025
    title: "File 7: All ranks, scores, deciles and population denominators for the Indices of Deprivation"
    edition: "2025-10"
    url: https://assets.publishing.service.gov.uk/media/691ded56d140bbbaa59a2a7d/File_7_IoD2025_All_Ranks_Scores_Deciles_Population_Denominators.csv
    filename: File_7_IoD2025_All_Ranks_Scores_Deciles_Population_Denominators.csv
    header_contains: LSOA code (2021)

  ons_lsoa_population_2022_2024:
    source: ons_population_estimates
    title: "Lower layer Super Output Area population estimates, mid-2022 revised (Nov 2025) to mid-2024"
    edition: "2025-11"
    url: https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/populationandmigration/populationestimates/datasets/lowersuperoutputareamidyearpopulationestimates/mid2022revisednov2025tomid2024/sapelsoasyoa20222024.xlsx
    filename: sapelsoasyoa20222024.xlsx

  lsoa11_sicbl_icb_lad_2022:
    source: ons_geography_lookups
    title: LSOA (2011) to SICBL to Integrated Care Boards to LAD (July 2022) Lookup in EN
