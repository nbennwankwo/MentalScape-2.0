[project]
name = "mentalscape"
version = "0.1.0"
description = "Decision support for NHS mental health service planning, from open data to recommendation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nkemjika Ben-Nwankwo" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
warehouse = [
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
    "dbt-postgres>=1.9",
    "psycopg[binary]>=3.2",
    "python-calamine>=0.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
]

[project.urls]
Repository = "https://github.com/nbennwankwo/MentalScape-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentalscape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: runs dbt end to end"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
